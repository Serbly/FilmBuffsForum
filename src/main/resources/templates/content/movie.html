<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie.title}"></title>
    <link rel="stylesheet" th:href="@{/css/content/movie.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
</head>
<body>

<div th:replace="~{/fragments/navbar-main :: body}"></div>

<div class="movie-container">

    <div class="movie-header">
        <h2 th:text="${movie.title}"></h2>
        <div class="meta">
            <span th:text="${movie.releaseYear}"></span>
            <span th:text="${movie.type}"></span>
        </div>
    </div>

    <div class="genres">
        <span th:each="g : ${movie.genres}" th:text="${g.name}"></span>
    </div>

    <div class="description" th:text="${movie.description}"></div>

    <h3>Обсуждения</h3>

    <div class="posts">
        <div class="post" th:each="p : ${posts}">
            <a th:href="@{/app/posts/{id}(id=${p.id})}" th:text="${p.title}"></a>
        </div>
    </div>

</div>

</body>
</html>
