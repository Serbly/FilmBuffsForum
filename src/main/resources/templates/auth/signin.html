<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход | FilmBuffs Forum</title>
    <link rel="stylesheet" th:href="@{/css/auth/authorization.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<main class="container">
    <div class="auth-card">

        <h2>Вход</h2>

        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>

        <form th:action="@{/auth/signin}"
              th:object="${loginRequest}"
              method="post">

            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text"
                       th:field="*{username}"
                       required
                       placeholder="Введите username">
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password"
                       th:field="*{password}"
                       required
                       placeholder="Введите пароль">
            </div>

            <button type="submit" class="btn">
                Войти
            </button>
        </form>

        <div class="remember">
            <input type="checkbox" name="rememberMe" id="rememberMe">
            <label for="rememberMe">Запомнить меня</label>
        </div>

        <div class="auth-link">
            Нет аккаунта?
            <a th:href="@{/auth/signup}">Зарегистрироваться</a>
        </div>

    </div>
</main>

</body>
</html>
