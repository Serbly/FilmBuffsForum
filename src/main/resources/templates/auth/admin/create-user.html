<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление пользователем</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/auth/admin/create-user.css}">
</head>
<body>

<div class="container">
    <form class="card"
          th:object="${request}"
          method="post"
          th:attr="action=${editMode}
          ? '/app/admin/dashboard/update'
          : '/app/admin/dashboard/create'">

        <h2 th:text="${editMode} ? 'Редактирование пользователя' : 'Создание пользователя'"></h2>

        <input type="text"
               th:field="*{username}"
               placeholder="Username"
               required>

        <input type="password"
               th:field="*{password}"
               placeholder="Пароль">

        <label class="roles">
            <input type="checkbox" value="ROLE_USER"
                   th:field="*{roles}">
            USER
        </label>

        <label class="roles">
            <input type="checkbox" value="ROLE_ADMIN"
                   th:field="*{roles}">
            ADMIN
        </label>

        <button class="btn primary" type="submit"
                th:text="${editMode} ? 'Сохранить изменения' : 'Создать пользователя'">
        </button>

        <a id="btn-back" href="/app/admin/dashboard" class="btn secondary">
            Назад
        </a>

        <p class="error" th:if="${error}" th:text="${error}"></p>
    </form>
</div>

</body>
</html>
