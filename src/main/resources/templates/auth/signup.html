<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация | FilmBuffs Forum</title>
    <link rel="stylesheet" th:href="@{/css/auth/authorization.css}">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/navbar.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: body}"></div>

<main class="container">
    <div class="auth-card">

        <h2>Регистрация</h2>

        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>

        <form th:action="@{/auth/signup}"
              th:object="${createUserRequest}"
              method="post">

            <div class="form-group">
                <label>Имя пользователя</label>
                <label>
                    <input type="text" th:field="*{username}" required>
                </label>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <label>
                    <input type="password" th:field="*{password}" required>
                </label>
            </div>

            <button type="submit" class="btn">
                Зарегистрироваться
            </button>
        </form>

        <div class="auth-link">
            Уже есть аккаунт?
            <a th:href="@{/auth/signin}">Войти</a>
        </div>

    </div>
</main>

</body>
</html>
